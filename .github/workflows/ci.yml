name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fm
          POSTGRES_PASSWORD: fm
          POSTGRES_DB: fm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fm" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fm:fm@127.0.0.1:5432/fm_test
      - name: Migration matches models
        run: python -m alembic upgrade head && python -m alembic check
        env:
          DATABASE_URL: postgresql+psycopg://fm:fm@127.0.0.1:5432/fm_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
