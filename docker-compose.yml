# Production stack: only Caddy is published (ports 80/443, automatic HTTPS for DOMAIN).
# PostgreSQL, the API and the worker stay on the internal network.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fm
      POSTGRES_DB: fm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm -d fm"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: formula-manager:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fm:${POSTGRES_PASSWORD}@db:5432/fm
      PUBLIC_ORIGIN: https://${DOMAIN}
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: formula-manager:latest
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fm:${POSTGRES_PASSWORD}@db:5432/fm
    volumes:
      - files:/data
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
