[project]
name = "formula-manager"
version = "0.1.0"
description = "Master formula literature tracking, AI-assisted extraction and pharmacist review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "anthropic>=1.8",
  "openai>=1.60",
  "reportlab>=4.2",
  "python-bidi>=0.6",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
